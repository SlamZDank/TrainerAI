version: '3.8'

services:
  postgres:
    image: docker.io/postgres:16
    container_name: trainerai_postgres
    environment:
      POSTGRES_DB: trainerai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trainerai-network

volumes:
  postgres_data:

networks:
  trainerai-network:
    driver: bridge
